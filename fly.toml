# fly.toml app configuration file generated for hcmis-backend on 2026-05-28T03:57:54Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = "hcmis-backend"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[deploy]
  release_command = "uv run alembic upgrade head"

[env]
  ENVIRONMENT = "production"
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  checks = [{ grace_period = '30s', interval = '30s', method = 'GET', path = '/health', timeout = '10s' }]
  concurrency = { hard_limit = 40, soft_limit = 20, type = 'requests' }

  [http_service.concurrency]
    type = "requests"
    soft_limit = 20
    hard_limit = 40

  [[http_service.checks]]
    interval = "30s"
    timeout = "10s"
    grace_period = "30s"
    method = "GET"
    path = "/health"

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
  processes = ['app']
